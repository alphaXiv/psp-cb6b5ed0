<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="PSP minus Best-of-4 differences over five repeats">
  <rect width="960" height="470" fill="#fbfcfe"/>
