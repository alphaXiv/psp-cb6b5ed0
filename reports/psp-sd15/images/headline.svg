<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Paper and observed PSP gains over Best-of-N=4</title>
  <desc id="desc">ImageReward gains were 0.172 in the paper and 0.160 observed. GenEval gains were 0.032 in the paper and minus 0.004 observed. Observed confidence intervals are shown.</desc>
  <rect width="900" height="430" fill="#fbfaf7"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#17202a">PSP gain over matched-compute Best-of-N=4</text>
  <text x="235" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#17202a">ImageReward</text>
  <text x="675" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#17202a">GenEval correctness</text>
  <line x1="80" y1="330" x2="390" y2="330" stroke="#80909d" stroke-width="2"/>
  <line x1="520" y1="330" x2="830" y2="330" stroke="#80909d" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#4b5963">
    <text x="80" y="353" text-anchor="middle">0</text><text x="235" y="353" text-anchor="middle">+0.12</text><text x="390" y="353" text-anchor="middle">+0.24</text>
    <text x="520" y="353" text-anchor="middle">−0.05</text><text x="675" y="353" text-anchor="middle">0</text><text x="830" y="353" text-anchor="middle">+0.05</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#26343d">
    <text x="72" y="150" text-anchor="end">Paper</text><text x="72" y="255" text-anchor="end">Observed</text>
    <text x="512" y="150" text-anchor="end">Paper</text><text x="512" y="255" text-anchor="end">Observed</text>
  </g>
  <rect x="80" y="118" width="222" height="46" rx="5" fill="#8795a1"/>
  <rect x="80" y="223" width="207" height="46" rx="5" fill="#2b7a78"/>
  <text x="312" y="149" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#17202a">+0.172</text>
  <text x="287" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#17202a">+0.160</text>
  <line x1="199" y1="246" x2="380" y2="246" stroke="#d35400" stroke-width="4"/>
  <line x1="199" y1="238" x2="199" y2="254" stroke="#d35400" stroke-width="3"/>
  <line x1="380" y1="238" x2="380" y2="254" stroke="#d35400" stroke-width="3"/>
  <rect x="675" y="118" width="99" height="46" rx="5" fill="#8795a1"/>
  <rect x="662" y="223" width="13" height="46" rx="5" fill="#2b7a78"/>
  <text x="784" y="149" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#17202a">+0.032</text>
  <text x="669" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#17202a">−0.004</text>
  <line x1="546" y1="246" x2="778" y2="246" stroke="#d35400" stroke-width="4"/>
  <line x1="546" y1="238" x2="546" y2="254" stroke="#d35400" stroke-width="3"/>
  <line x1="778" y1="238" x2="778" y2="254" stroke="#d35400" stroke-width="3"/>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#4b5963">
    <rect x="245" y="388" width="18" height="12" fill="#8795a1"/><text x="270" y="399">Paper (553 prompts)</text>
    <rect x="475" y="388" width="18" height="12" fill="#2b7a78"/><text x="500" y="399">Observed (240 paired pools)</text>
    <line x1="688" y1="394" x2="722" y2="394" stroke="#d35400" stroke-width="3"/><text x="730" y="399">95% paired bootstrap</text>
  </g>
</svg>
