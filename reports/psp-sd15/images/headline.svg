<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Matched-compute PSP improves ImageReward over Best-of-4, while GenEval is unchanged">
  <rect width="960" height="500" fill="#fbfcfe"/>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#182230}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#52606d}.axis{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#d9e2ec;stroke-width:1}.label{font-size:15px}.value{font-size:17px;font-weight:700}.note{font-size:16px;font-weight:700}
  </style>
  <text x="38" y="42" class="title">Matched compute: reward improves; structural score does not</text>
  <text x="38" y="68" class="sub">Five seed windows × 48 stratified GenEval prompts; means across repeats</text>
  <text x="72" y="112" class="note">ImageReward ↑</text>
  <line x1="72" y1="390" x2="440" y2="390" class="axis"/>
  <line x1="72" y1="130" x2="72" y2="410" class="axis"/>
  <line x1="72" y1="368" x2="440" y2="368" class="grid"/><text x="43" y="373" class="sub">0.0</text>
  <line x1="72" y1="252" x2="440" y2="252" class="grid"/><text x="43" y="257" class="sub">0.5</text>
  <line x1="72" y1="136" x2="440" y2="136" class="grid"/><text x="43" y="141" class="sub">1.0</text>
  <rect x="108" y="368" width="72" height="15" rx="4" fill="#9aa5b1"/>
  <rect x="225" y="188" width="72" height="180" rx="4" fill="#64748b"/>
  <rect x="342" y="151" width="72" height="217" rx="4" fill="#0f9d8a"/>
  <text x="144" y="405" text-anchor="middle" class="label">Standard</text>
  <text x="261" y="405" text-anchor="middle" class="label">Best-of-4</text>
  <text x="378" y="405" text-anchor="middle" class="label">PSP</text>
  <text x="144" y="358" text-anchor="middle" class="value">−0.065</text>
  <text x="261" y="178" text-anchor="middle" class="value">0.776</text>
  <text x="378" y="141" text-anchor="middle" class="value">0.936</text>
  <path d="M261 165 L261 144 L378 144 L378 130" fill="none" stroke="#0f9d8a" stroke-width="2"/>
  <text x="320" y="119" text-anchor="middle" class="note" fill="#087f6d">+0.160</text>

  <text x="542" y="112" class="note">GenEval correctness ↑</text>
  <line x1="542" y1="390" x2="916" y2="390" class="axis"/>
  <line x1="542" y1="130" x2="542" y2="390" class="axis"/>
  <line x1="542" y1="390" x2="916" y2="390" class="grid"/><text x="511" y="395" class="sub">0.0</text>
  <line x1="542" y1="286" x2="916" y2="286" class="grid"/><text x="511" y="291" class="sub">0.2</text>
  <line x1="542" y1="182" x2="916" y2="182" class="grid"/><text x="511" y="187" class="sub">0.4</text>
  <rect x="578" y="260" width="72" height="130" rx="4" fill="#9aa5b1"/>
  <rect x="695" y="199" width="72" height="191" rx="4" fill="#64748b"/>
  <rect x="812" y="202" width="72" height="188" rx="4" fill="#0f9d8a"/>
  <text x="614" y="415" text-anchor="middle" class="label">Standard</text>
  <text x="731" y="415" text-anchor="middle" class="label">Best-of-4</text>
  <text x="848" y="415" text-anchor="middle" class="label">PSP</text>
  <text x="614" y="250" text-anchor="middle" class="value">0.250</text>
  <text x="731" y="189" text-anchor="middle" class="value">0.367</text>
  <text x="848" y="192" text-anchor="middle" class="value">0.363</text>
  <text x="790" y="151" text-anchor="middle" class="note" fill="#7b3f00">−0.004</text>
  <text x="480" y="470" text-anchor="middle" class="sub">PSP and Best-of-4 each use 256 denoising forward passes per prompt.</text>
</svg>
