apiVersion: batch/v1
kind: Job
metadata:
  name: psp-repro-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 37800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: repro
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "48"
              memory: "256Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "48"
              memory: "256Gi"
          env:
            - name: HF_HOME
              value: /tmp/huggingface
            - name: TORCH_HOME
              value: /tmp/torch
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTHONUNBUFFERED
              value: "1"
